name: Build Neko
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang cmake libplist-dev fakeroot libssl-dev libtinfo6

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $HOME/theos/sdks/
          mv sdks-master/*.sdk $HOME/theos/sdks/

      - name: Download & Build Luau for iOS
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          mkdir -p vendor/luau/lib vendor/luau/include
          cd vendor/luau-src
          # Find the exact SDK folder and tell CMake where it is
          SDK_PATH=$(find $HOME/theos/sdks -name "iPhoneOS*.sdk" | head -n 1)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_OSX_SYSROOT=$SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-target arm64-apple-ios15.0" \
            -DCMAKE_CXX_FLAGS="-target arm64-apple-ios15.0" \
            -DLUAU_BUILD_TESTS=OFF
          cmake --build build -j --target Luau.VM Luau.Compiler
          cp build/Luau.VM.a build/Luau.Compiler.a ../luau/lib/
          cp VM/include/*.h Compiler/include/*.h ../luau/include/

      - name: Build Tweak (No Signing)
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make

      - name: Extract Dylib
        run: |
          find .theos -name "neko.dylib" -exec cp {} ./neko.dylib \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-dylib
          path: neko.dylib
