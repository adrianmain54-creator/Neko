name: Build Neko Stealth IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld llvm cmake zip unzip libssl-dev python3 python3-pip jq
          pip3 install lief
          
          # Make sure llvm tools are linked
          sudo ln -sf $(which llvm-install-name-tool) /usr/local/bin/install_name_tool
          sudo ln -sf $(which llvm-otool) /usr/local/bin/otool

      - name: Download SDK
        run: git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Clone and Build Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby
          cd vendor/dobby
          mkdir -p build
          cd build
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          # Pass the explicit path to the LLVM tools
          cmake .. -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_ARCHITECTURES="arm64" \
                   -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
                   -DCMAKE_C_COMPILER=clang \
                   -DCMAKE_CXX_COMPILER=clang++ \
                   -DCMAKE_C_FLAGS="-target arm64-apple-ios15.0" \
                   -DCMAKE_CXX_FLAGS="-target arm64-apple-ios15.0" \
                   -DCMAKE_INSTALL_NAME_TOOL=$(which llvm-install-name-tool) \
                   -DCMAKE_OTOOL=$(which llvm-otool) \
                   -DCMAKE_BUILD_TYPE=Release
          make -j4

      - name: Compile Core Luau Modules
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          mkdir -p ../../vendor/luau/include
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          for module in VM Compiler Ast Common Bytecode; do
            mkdir -p "build_$module"
            find "$module/src" -name "*.cpp" | while read f; do
              clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 -fvisibility=hidden $INCLUDES -c "$f" -o "build_$module/$(basename "${f%.cpp}").o" || true
            done
          done
          
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Stealth Payload
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 -fvisibility=hidden -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include -Ivendor/dobby/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          LUAU_OBJS=$(find vendor/luau-src/build_* -name "*.o" | tr '\n' ' ')
          DOBBY_LIB=$(find vendor/dobby/build -name "libdobby.a" | head -n 1)
          
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc -fvisibility=hidden \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework WebKit -framework Security \
            Api.o Tweak.o $LUAU_OBJS $DOBBY_LIB \
            -o libswiftCore.dylib

      - name: Strip and Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          llvm-strip -x libswiftCore.dylib || echo "Skipping strip"
          ./ldid_linux_x86_64 -S libswiftCore.dylib

      - name: Static Inject & Verify
        run: |
          mkdir extract
          unzip roblox.ipa -d extract
          APP_PATH="extract/Payload/Roblox.app"
          BINARY_PATH="$APP_PATH/Roblox"
          PLIST_PATH="$APP_PATH/Info.plist"
          
          cp libswiftCore.dylib "$APP_PATH/"
          
          python3 -c "
          import lief
          bin_path = '$BINARY_PATH'
          binary = lief.parse(bin_path)
          binary.add_library('@executable_path/libswiftCore.dylib')
          binary.write(bin_path)
          new_bin = lief.parse(bin_path)
          has_lib = any('libswiftCore.dylib' in lib for lib in new_bin.libraries)
          if not has_lib:
              raise Exception('FATAL: Injection failed!')
          "
          
          python3 -c "
          import plistlib
          with open('$PLIST_PATH', 'rb') as f:
              plist = plistlib.load(f)
          plist['CFBundleDisplayName'] = 'Neko'
          plist['CFBundleName'] = 'Neko'
          with open('$PLIST_PATH', 'wb') as f:
              plistlib.dump(plist, f)
          "
          
          ./ldid_linux_x86_64 -S "$BINARY_PATH"
          cd extract && zip -qry ../Neko-Fast.ipa Payload && cd ..

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: libswiftCore-dylib
          path: libswiftCore.dylib

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: Neko-Fast-IPA
          path: Neko-Fast.ipa
