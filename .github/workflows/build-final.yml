name: Build Neko Pure
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld cmake libplist-dev fakeroot libssl-dev libtinfo6 zip

      - name: Download SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Build Luau for iOS with CMake
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          # Configure CMake for iOS
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_CLI=OFF \
            -DLUAU_BUILD_WEB=OFF
          
          # Build ONLY the VM and Compiler libraries
          cmake --build build -j --target Luau.VM Luau.Compiler
          
          # Copy the compiled libraries and headers for the tweak
          mkdir -p ../../vendor/luau/lib
          mkdir -p ../../vendor/luau/include
          
          cp build/libLuau.VM.a ../../vendor/luau/lib/
          cp build/libLuau.Compiler.a ../../vendor/luau/lib/
          
          # Copy all necessary headers
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Tweak and Link
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          # Link against the CMake-built static libraries
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            Api.o Tweak.o \
            vendor/luau/lib/libLuau.VM.a \
            vendor/luau/lib/libLuau.Compiler.a \
            -o neko.dylib

      - name: Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          ./ldid_linux_x86_64 -S neko.dylib
          zip neko-dylib-final.zip neko.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-dylib-final
          path: neko-dylib-final.zip
