name: Build Neko Stealth IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld cmake zip unzip libssl-dev
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib && clang insert_dylib/main.c -o insert_dylib && sudo cp insert_dylib /usr/local/bin/ && cd ..

      - name: Download SDK
        run: git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Compile Luau (PC-Level Speed)
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          mkdir -p ../../vendor/luau/include
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          for module in VM Compiler Ast Common Analysis; do
            for f in $module/src/*.cpp; do
              clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 -flto $INCLUDES -c "$f" -o "build_$(basename $f).o" || true
            done
          done
          
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Stealth Payload
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 -flto -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          # NO SUBSTRATE LINKING
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc -flto \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework WebKit \
            Api.o Tweak.o vendor/luau-src/*.o \
            -o libswiftCore.dylib

      - name: Strip and Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          strip -x libswiftCore.dylib
          ./ldid_linux_x86_64 -S libswiftCore.dylib

      - name: Static Inject into Roblox IPA
        run: |
          mkdir extract
          unzip roblox.ipa -d extract
          APP_PATH="extract/Payload/Roblox.app"
          BINARY_PATH="$APP_PATH/Roblox"
          
          cp libswiftCore.dylib "$APP_PATH/"
          insert_dylib --inplace --codesign @executable_path/libswiftCore.dylib "$BINARY_PATH"
          ./ldid_linux_x86_64 -S "$BINARY_PATH"
          
          cd extract && zip -qry ../Neko-Fast.ipa Payload && cd ..

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: Neko-Fast-IPA
          path: Neko-Fast.ipa
