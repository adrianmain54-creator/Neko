name: Build Neko IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld zip unzip python3 python3-pip
          pip3 install lief

      - name: Download SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Compile Luau Directly (No CMake)
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          mkdir -p build_all
          # Compile every .cpp file to object files
          for module in VM Compiler Ast Common; do
            for f in $module/src/*.cpp; do
              clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_all/$(basename $f).o" || true
            done
          done
          
          # Fix missing FFlag manually
          cat << 'EOF' > Flags.cpp
          #include "Luau/Common.h"
          LUAU_FASTFLAGVARIABLE(LuauEmitCallFeedback)
          EOF
          clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c Flags.cpp -o build_all/Flags.o
          
          mkdir -p ../../vendor/luau/include
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Dylib and Link
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          # Link everything into one dylib, avoiding .a archives entirely
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            Api.o Tweak.o vendor/luau-src/build_all/*.o \
            -o neko.dylib

      - name: Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          ./ldid_linux_x86_64 -S neko.dylib

      - name: Inject Dylib into IPA (Cloud Injection)
        run: |
          mkdir extract
          unzip roblox.ipa -d extract
          
          # Copy dylib into the app
          cp neko.dylib extract/Payload/Roblox.app/
          
          # Use Python lief to inject the load command directly into the binary
          python3 -c "
          import lief
          bin_path = 'extract/Payload/Roblox.app/Roblox'
          binary = lief.parse(bin_path)
          dylib = lief.MachO.DylibCommand.create('@executable_path/neko.dylib')
          binary.add(dylib)
          binary.write(bin_path)
          "
          
          # Re-zip the IPA
          cd extract
          zip -qry ../Neko-Roblox.ipa Payload
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neko-Roblox-IPA
          path: Neko-Roblox.ipa
