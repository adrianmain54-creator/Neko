name: Build Neko Linux

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make git curl clang cmake ninja-build libplist-dev fakeroot libssl-dev libtinfo6

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/theos/bin" >> $GITHUB_PATH

    - name: Download iOS SDK
      run: |
        rm -rf $GITHUB_WORKSPACE/theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks

    - name: Compile Luau for iOS manually (bypassing CMake)
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
        cd vendor/luau-src
        
        mkdir -p ../../vendor/luau/lib ../../vendor/luau/include
        
        # Grab the NEWEST SDK, not the oldest one
        SDK_PATH=$(find $GITHUB_WORKSPACE/theos/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
        echo "Using SDK: $SDK_PATH"
        
        # Point to the modern C++ headers inside the SDK
        CXX_INCLUDES="-I$SDK_PATH/usr/include/c++/v1"
        
        # Compile Luau VM
        mkdir -p build_vm
        for f in VM/src/*.cpp; do
          clang++ -isysroot $SDK_PATH -target arm64-apple-ios15.0 -O3 -fno-exceptions -fno-rtti -Iinclude -IVM/include -IAst/include -ICommon/include -ICompiler/include $CXX_INCLUDES -c "$f" -o "build_vm/$(basename $f).o"
        done
        ar rcs ../../vendor/luau/lib/Luau.VM.a build_vm/*.o

        # Compile Luau Compiler
        mkdir -p build_compiler
        for f in Compiler/src/*.cpp; do
          clang++ -isysroot $SDK_PATH -target arm64-apple-ios15.0 -O3 -fno-exceptions -fno-rtti -Iinclude -IVM/include -IAst/include -ICommon/include -ICompiler/include $CXX_INCLUDES -c "$f" -o "build_compiler/$(basename $f).o"
        done
        ar rcs ../../vendor/luau/lib/Luau.Compiler.a build_compiler/*.o

        # Copy headers
        cp VM/include/*.h Compiler/include/*.h ../../vendor/luau/include/

    - name: Build Neko Tweak
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make

    - name: Extract and Upload Dylib
      run: |
        find .theos -name "neko.dylib" -exec cp {} ./neko.dylib \;
        ls -la neko.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neko-dylib-final
        path: neko.dylib
