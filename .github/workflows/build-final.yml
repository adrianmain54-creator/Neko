name: Build Neko Final

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-13
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Theos & SDK
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        $HOME/theos/bin/theos-sdk install --with-ios-sdk 16.5

    - name: Build Luau for iOS
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
        cd vendor/luau-src
        mkdir -p ../../vendor/luau/lib ../../vendor/luau/include
        
        # Native macOS CMake cross-compilation for iOS. No external toolchain needed.
        cmake -B build \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_BUILD_TYPE=Release \
          -DLUAU_BUILD_TESTS=OFF
          
        cmake --build build -j --target Luau.VM Luau.Compiler
        
        cp build/Luau.VM.a build/Luau.Compiler.a ../../vendor/luau/lib/
        cp VM/include/*.h Compiler/include/*.h ../../vendor/luau/include/

    - name: Build Neko Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make

    - name: Extract and Upload Dylib
      run: |
        find .theos -name "neko.dylib" -exec cp {} ./neko.dylib \;
        ls -la neko.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neko-dylib-final
        path: neko.dylib
