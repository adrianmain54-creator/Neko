name: Build Neko Pure
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld cmake libplist-dev fakeroot libssl-dev libtinfo6 zip

      - name: Download SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Compile All Luau Modules (VM, Compiler, Ast, Common, Analysis)
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          # Compile every single .cpp file in every module
          for module in VM Compiler Ast Common Analysis; do
            mkdir -p "build_$module"
            for f in $module/src/*.cpp; do
              clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_$module/$(basename $f).o"
            done
          done
          
          # Ensure headers are copied for the tweak
          for d in $(find . -type d -name "include"); do
            mkdir -p ../../vendor/luau/include
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Create Explicit Flag Definition
        run: |
          # This guarantees the missing symbol is defined
          cat << 'EOF' > vendor/luau-src/Flags.cpp
          #include "Luau/Common.h"
          LUAU_FASTFLAGVARIABLE(LuauEmitCallFeedback)
          EOF
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find vendor/luau-src -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c vendor/luau-src/Flags.cpp -o vendor/luau-src/Flags.o

      - name: Compile Tweak and Link Everything
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          # Collect EVERY object file, including the new Flags.o
          LUAU_OBJS=$(find vendor/luau-src -name "*.o" | tr '\n' ' ')
          
          # Link with -Wl,-all_load to force inclusion of all symbols
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc \
            -Wl,-all_load \
            -framework Foundation -framework UIKit \
            Api.o Tweak.o $LUAU_OBJS \
            -o neko.dylib

      - name: Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          ./ldid_linux_x86_64 -S neko.dylib
          zip neko-dylib-final.zip neko.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-dylib-final
          path: neko-dylib-final.zip
