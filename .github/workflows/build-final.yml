name: Build Neko Final

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make git curl clang cmake ninja-build libplist-dev fakeroot libssl-dev libtinfo6

    # Manually install Theos instead of using the buggy action
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Download iOS SDK
      run: |
        # Clone the SDK repo instead of using a broken zip download
        git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks

    - name: Build Luau for iOS
      run: |
        git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
        cd vendor/luau-src
        
        curl -L -o ios.toolchain.cmake https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake
        
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
          -DPLATFORM=OS64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLUAU_BUILD_TESTS=OFF
        
        cmake --build build
        
        mkdir -p ../../vendor/luau/lib ../../vendor/luau/include
        cp build/Luau.VM.a build/Luau.Compiler.a ../../vendor/luau/lib/
        cp VM/include/*.h Compiler/include/*.h ../../vendor/luau/include/

    - name: Build Neko Tweak
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make

    - name: Extract and Upload Dylib
      run: |
        find .theos -name "neko.dylib" -exec cp {} ./neko.dylib \;
        ls -la neko.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neko-dylib-final
        path: neko.dylib
