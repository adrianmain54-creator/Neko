name: Build Neko Pure
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld cmake libplist-dev fakeroot libssl-dev libtinfo6 zip

      - name: Download SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Compile Luau (VM, Compiler, and Ast)
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          mkdir -p ../../vendor/luau/include
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          # Compile VM
          mkdir -p build_vm
          for f in VM/src/*.cpp; do
            clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_vm/$(basename $f).o"
          done
          
          # Compile Compiler
          mkdir -p build_compiler
          for f in Compiler/src/*.cpp; do
            clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_compiler/$(basename $f).o"
          done
          
          # Compile Ast (this fixes the gAstRttiIndex error)
          mkdir -p build_ast
          for f in Ast/src/*.cpp; do
            clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_ast/$(basename $f).o"
          done
          
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Tweak Directly
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -std=c++17 -stdlib=libc++ -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          # Link ALL object files, including the Ast ones
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc -undefined dynamic_lookup \
            -framework Foundation -framework UIKit \
            Api.o Tweak.o \
            vendor/luau-src/build_vm/*.o vendor/luau-src/build_compiler/*.o vendor/luau-src/build_ast/*.o \
            -o neko.dylib

      - name: Sign Dylib
        run: |
          # Download ldid and sign the dylib so LiveContainer accepts it
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          ./ldid_linux_x86_64 -S neko.dylib
          zip neko-dylib-final.zip neko.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-dylib-final
          path: neko-dylib-final.zip
