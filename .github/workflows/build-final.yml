name: Build Neko Stealth IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl clang lld llvm cmake zip unzip libssl-dev python3 python3-pip jq
          pip3 install lief

      - name: Download IPA from Release (API)
        run: |
          # Get the download URL via the GitHub API
          ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/V1" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .url')
          
          # Download the actual binary file
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o roblox.ipa "$ASSET_URL"

      - name: Download SDK
        run: git clone --depth 1 https://github.com/theos/sdks.git sdks

      - name: Compile Core Luau Modules
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          cd vendor/luau-src
          mkdir -p ../../vendor/luau/include
          
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          INCLUDES=$(find . -type d -name "include" | sed 's/^/-I/' | tr '\n' ' ')
          
          # Compile ONLY these exact modules
          for module in VM Compiler Ast Common Bytecode; do
            mkdir -p "build_$module"
            find "$module/src" -name "*.cpp" | while read f; do
              clang++ -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 $INCLUDES -c "$f" -o "build_$module/$(basename "${f%.cpp}").o" || true
            done
          done
          
          # Copy headers
          for d in $(find . -type d -name "include"); do
            cp -r $d/* ../../vendor/luau/include/ 2>/dev/null || true
          done

      - name: Compile Stealth Payload
        run: |
          SDK_PATH=$(find $GITHUB_WORKSPACE/sdks -name "iPhoneOS*.sdk" | sort -V | tail -n 1)
          
          touch vendor/luau/include/lauxlib.h
          mv Tweak.xm Tweak.mm
          
          FLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0 -march=armv8.2-a+fp16+dotprod -std=c++17 -stdlib=libc++ -O3 -fno-modules -D_LIBCPP_USING_IF_EXISTS= -fobjc-arc -I. -Ivendor/luau/include"
          
          clang++ $FLAGS -c Tweak.mm -o Tweak.o
          clang++ $FLAGS -c Api.mm -o Api.o
          
          LUAU_OBJS=$(find vendor/luau-src/build_* -name "*.o" | tr '\n' ' ')
          
          clang++ -fuse-ld=lld -isysroot "$SDK_PATH" -target arm64-apple-ios15.0 -stdlib=libc++ -dynamiclib -fobjc-arc \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework WebKit \
            Api.o Tweak.o $LUAU_OBJS \
            -o libswiftCore.dylib

      - name: Strip and Sign Dylib
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          llvm-strip -x libswiftCore.dylib || echo "Skipping strip"
          ./ldid_linux_x86_64 -S libswiftCore.dylib

      - name: Static Inject & Rename App
        run: |
          mkdir extract
          unzip roblox.ipa -d extract
          APP_PATH="extract/Payload/Roblox.app"
          BINARY_PATH="$APP_PATH/Roblox"
          PLIST_PATH="$APP_PATH/Info.plist"
          
          # 1. Copy the payload
          cp libswiftCore.dylib "$APP_PATH/"
          
          # 2. Inject the load command
          python3 -c "
          import lief
          bin_path = '$BINARY_PATH'
          binary = lief.parse(bin_path)
          binary.add_library('@executable_path/libswiftCore.dylib')
          binary.write(bin_path)
          print('Injected libswiftCore.dylib successfully!')
          "
          
          # 3. Rename the app to Neko
          python3 -c "
          import plistlib
          with open('$PLIST_PATH', 'rb') as f:
              plist = plistlib.load(f)
          plist['CFBundleDisplayName'] = 'Neko'
          plist['CFBundleName'] = 'Neko'
          with open('$PLIST_PATH', 'wb') as f:
              plistlib.dump(plist, f)
          print('Renamed app to Neko!')
          "
          
          # 4. Re-sign the binary
          ./ldid_linux_x86_64 -S "$BINARY_PATH"
          
          # 5. Re-zip
          cd extract && zip -qry ../Neko-Fast.ipa Payload && cd ..

      # --- SEPARATE UPLOAD BUTTONS ---
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: libswiftCore-dylib
          path: libswiftCore.dylib

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: Neko-Fast-IPA
          path: Neko-Fast.ipa
