name: Build Neko
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --recursive https://github.com/theos/theos.git $HOME/theos
      - run: echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - run: $HOME/theos/bin/theos-sdk install --with-ios-sdk 16.5
      - run: |
          git clone --depth 1 https://github.com/luau-lang/luau vendor/luau-src
          mkdir -p vendor/luau/lib vendor/luau/include
          cd vendor/luau-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$THEOS/toolchain/linux/iphone.cmake
          cmake --build build -j --target Luau.VM Luau.Compiler
          cp build/Luau.VM.a build/Luau.Compiler.a ../luau/lib/
          cp VM/include/*.h Compiler/include/*.h ../luau/include/
      - run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1
      - run: find .theos -name "neko.dylib" -exec cp {} ./neko.dylib \;
      - uses: actions/upload-artifact@v4
        with:
          name: neko-dylib
          path: neko.dylib
